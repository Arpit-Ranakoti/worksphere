<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employer Dashboard — WorkSphere</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<div id="navbar"></div>

<div class="container py-4">
  <h2 class="text-navy fw-bold" id="welcomeMsg">Welcome!</h2>

  <div class="row g-3 my-2">
    <div class="col-md-2 col-6"><div class="stat-card"><div class="stat-value" id="statPosted">-</div><div class="stat-label">Jobs Posted</div></div></div>
    <div class="col-md-2 col-6"><div class="stat-card"><div class="stat-value" id="statOpen">-</div><div class="stat-label">Open Jobs</div></div></div>
    <div class="col-md-2 col-6"><div class="stat-card"><div class="stat-value" id="statApps">-</div><div class="stat-label">Applications</div></div></div>
    <div class="col-md-2 col-6"><div class="stat-card"><div class="stat-value" id="statSelected">-</div><div class="stat-label">Selected</div></div></div>
    <div class="col-md-2 col-6"><div class="stat-card"><div class="stat-value" id="statCompleted">-</div><div class="stat-label">Completed</div></div></div>
    <div class="col-md-2 col-6"><div class="stat-card"><div class="stat-value" id="statRating">-</div><div class="stat-label">Rating</div></div></div>
  </div>

  <div class="d-flex justify-content-between align-items-center mt-4">
    <h4 class="section-title mb-0" id="myjobs">My Jobs</h4>
    <a href="post-job.html" class="btn btn-accent"><i class="bi bi-plus-circle"></i> Post Job</a>
  </div>
  <div id="myJobsList" class="row g-3 mt-1">
    <div class="col-12 text-muted">Loading...</div>
  </div>
</div>

<div id="footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script src="js/employer.js"></script>
</body>
</html>
