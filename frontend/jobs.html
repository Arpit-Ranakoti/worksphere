<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Browse Jobs — WorkSphere</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<div id="navbar"></div>

<div class="container py-4">
  <h2 class="section-title">Browse Jobs</h2>

  <div class="card-ws p-3 mb-4">
    <div class="row g-2">
      <div class="col-md-3">
        <input type="text" id="fKeyword" class="form-control" placeholder="Search job title...">
      </div>
      <div class="col-md-2">
        <input type="text" id="fLocation" class="form-control" placeholder="Location">
      </div>
      <div class="col-md-2">
        <select id="fCategory" class="form-select">
          <option value="">All Categories</option>
          <option>Events</option>
          <option>Restaurants</option>
          <option>Delivery</option>
          <option>Retail</option>
          <option>Warehouse</option>
          <option>Construction</option>
          <option>Hospitality</option>
          <option>Cleaning</option>
          <option>Data Entry</option>
          <option>Marketing</option>
          <option>Photography</option>
          <option>Customer Service</option>
          <option>Other</option>
        </select>
      </div>
      <div class="col-md-2">
        <input type="date" id="fDate" class="form-control">
      </div>
      <div class="col-md-1">
        <input type="number" id="fMinPay" class="form-control" placeholder="Min ₹">
      </div>
      <div class="col-md-1">
        <input type="number" id="fMaxPay" class="form-control" placeholder="Max ₹">
      </div>
      <div class="col-md-1 d-grid">
        <button class="btn btn-accent" onclick="loadJobs()"><i class="bi bi-search"></i></button>
      </div>
    </div>
  </div>

  <div id="jobsAlert"></div>
  <div id="jobsList" class="row g-4">
    <div class="col-12 text-center text-muted">Loading jobs...</div>
  </div>
</div>

<div id="footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script src="js/jobs.js"></script>
<script>
  WS.renderNavbar("navbar", "jobs");
  WS.renderFooter("footer");
  loadJobs();
</script>
</body>
</html>
