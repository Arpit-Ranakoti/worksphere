<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employer Profile — WorkSphere</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<div id="navbar"></div>

<div class="container py-4">
  <h2 class="section-title">Employer Profile</h2>
  <div id="profileAlert"></div>

  <div class="card-ws p-4">
    <form id="employerProfileForm">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Organization Name</label>
          <input type="text" class="form-control" id="orgName" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Business Category</label>
          <select class="form-select" id="category">
            <option>Events</option><option>Restaurants</option><option>Delivery</option>
            <option>Retail</option><option>Warehouse</option><option>Construction</option>
            <option>Hospitality</option><option>Cleaning</option><option>Other</option>
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label">Location</label>
          <input type="text" class="form-control" id="location" placeholder="e.g. Rishikesh">
        </div>
        <div class="col-12">
          <label class="form-label">Description</label>
          <textarea class="form-control" id="description" rows="3" placeholder="Describe your organization..."></textarea>
        </div>
      </div>
      <button type="submit" class="btn btn-accent mt-4">Save Profile</button>
    </form>
  </div>

  <div class="row g-3 mt-4">
    <div class="col-md-4"><div class="stat-card"><div class="stat-value" id="profRating">-</div><div class="stat-label">Rating</div></div></div>
    <div class="col-md-4"><div class="stat-card"><div class="stat-value" id="profPosted">-</div><div class="stat-label">Jobs Posted</div></div></div>
    <div class="col-md-4"><div class="stat-card"><div class="stat-value" id="profCompleted">-</div><div class="stat-label">Completed Jobs</div></div></div>
  </div>
</div>

<div id="footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script>
  const user = WS.requireAuth(["EMPLOYER"]);
  WS.renderNavbar("navbar", "profile");
  WS.renderFooter("footer");

  async function loadProfile() {
    try {
      const profile = await WS.get("/users/me/employer-profile");
      document.getElementById("orgName").value = profile.organizationName || "";
      document.getElementById("category").value = profile.category || "Events";
      document.getElementById("location").value = profile.location || "";
      document.getElementById("description").value = profile.description || "";
      document.getElementById("profRating").innerText = profile.rating != null ? "⭐ " + profile.rating.toFixed(1) : "New";
      document.getElementById("profPosted").innerText = profile.totalJobsPosted ?? 0;
      document.getElementById("profCompleted").innerText = profile.completedJobs ?? 0;
    } catch (e) { /* not created yet */ }
  }

  document.getElementById("employerProfileForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    try {
      await WS.put("/users/me/employer-profile", {
        organizationName: document.getElementById("orgName").value,
        category: document.getElementById("category").value,
        location: document.getElementById("location").value,
        description: document.getElementById("description").value
      });
      WS.showAlert("profileAlert", "Profile saved successfully!", "success");
    } catch (err) {
      WS.showAlert("profileAlert", "Could not save profile: " + err.message);
    }
  });

  loadProfile();
</script>
</body>
</html>
