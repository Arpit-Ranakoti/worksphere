<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Disputes — WorkSphere</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<div id="navbar"></div>

<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center flex-wrap">
    <h2 class="section-title mb-0">My Disputes</h2>
    <button class="btn btn-accent" data-bs-toggle="modal" data-bs-target="#newDisputeModal">
      <i class="bi bi-plus-circle"></i> Raise Dispute
    </button>
  </div>
  <div id="disputeAlert"></div>
  <div id="disputesContainer" class="mt-3">
    <div class="text-muted">Loading...</div>
  </div>
</div>

<!-- New Dispute Modal -->
<div class="modal fade" id="newDisputeModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Raise a Dispute</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="newDisputeForm">
          <div class="mb-3">
            <label class="form-label">Related Commitment</label>
            <select class="form-select" id="disputeCommitment" required></select>
          </div>
          <div class="mb-3">
            <label class="form-label">Reason</label>
            <select class="form-select" id="disputeReason" required>
              <option>Payment Issue</option>
              <option>No-Show</option>
              <option>Incorrect Job Information</option>
              <option>Cancellation Disagreement</option>
              <option>Harassment/Report</option>
              <option>Work Completion Issue</option>
              <option>Other</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea class="form-control" id="disputeDescription" rows="4" required></textarea>
          </div>
          <div class="mb-3">
            <label class="form-label">Evidence (optional text or image URL)</label>
            <input type="text" class="form-control" id="disputeEvidence">
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-accent" onclick="submitDispute()">Submit Dispute</button>
      </div>
    </div>
  </div>
</div>

<div id="footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script src="js/disputes.js"></script>
</body>
</html>
