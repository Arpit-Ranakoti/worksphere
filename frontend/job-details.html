<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Job Details — WorkSphere</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<div id="navbar"></div>

<div class="container py-4">
  <div id="jdAlert"></div>
  <div id="jobDetailContainer">
    <div class="text-center text-muted py-5">Loading job details...</div>
  </div>
</div>

<div id="footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script>
  WS.renderNavbar("navbar", "jobs");
  WS.renderFooter("footer");

  const params = new URLSearchParams(window.location.search);
  const jobId = params.get("id");

  async function loadJobDetail() {
    if (!jobId) {
      document.getElementById("jobDetailContainer").innerHTML =
        '<div class="alert alert-warning">No job specified.</div>';
      return;
    }
    try {
      const job = await WS.request(`/jobs/${jobId}`, { auth: WS.isLoggedIn() });
      renderJobDetail(job);
    } catch (err) {
      document.getElementById("jobDetailContainer").innerHTML =
        `<div class="alert alert-danger">Could not load job: ${err.message}</div>`;
    }
  }

  function renderJobDetail(job) {
    const user = WS.getUser();
    const skills = (job.requiredSkills || []).map(s => `<span class="badge badge-skill">${s}</span>`).join(" ");
    const matchHtml = (job.matchScore !== undefined && job.matchScore !== null)
      ? `<span class="${WS.matchBadgeClass(job.matchScore)}">${Math.round(job.matchScore)}% Match</span>` : "";

    let actionHtml = "";
    if (!user) {
      actionHtml = `<a href="login.html" class="btn btn-accent">Login to Apply</a>`;
    } else if (user.role === "JOB_SEEKER") {
      if (job.alreadyApplied) {
        actionHtml = `<button class="btn btn-secondary" disabled>Already Applied</button>`;
      } else if (job.status === "OPEN") {
        actionHtml = `<button class="btn btn-accent" id="applyBtn">Apply Now</button>`;
      } else {
        actionHtml = `<button class="btn btn-secondary" disabled>Applications Closed</button>`;
      }
    } else {
      actionHtml = `<span class="text-muted">Only job seekers can apply.</span>`;
    }

    document.getElementById("jobDetailContainer").innerHTML = `
      <div class="card-ws p-4">
        <div class="d-flex justify-content-between align-items-start flex-wrap">
          <div>
            <h2 class="text-navy fw-bold">${job.title}</h2>
            <div class="mb-2">${WS.statusBadge(job.status)} ${matchHtml}</div>
          </div>
          <div class="fs-3 fw-bold text-navy">₹${job.pay}</div>
        </div>

        <div class="row mt-3 job-meta">
          <div class="col-md-3"><i class="bi bi-geo-alt"></i> ${job.location}</div>
          <div class="col-md-3"><i class="bi bi-calendar"></i> ${WS.formatDate(job.jobDate)}</div>
          <div class="col-md-3"><i class="bi bi-clock"></i> ${job.startTime} - ${job.endTime}</div>
          <div class="col-md-3"><i class="bi bi-people"></i> ${job.workersSelected}/${job.workersRequired} workers</div>
        </div>

        <hr>
        <h5>About the Job</h5>
        <p>${job.description}</p>

        <h5>Required Skills</h5>
        <p>${skills || '<span class="text-muted">No specific skills required</span>'}</p>

        ${job.depositRequired ? `<div class="alert alert-info">Commitment Deposit: ₹${job.depositAmount} <br><small>Demo payment — no real money is processed.</small></div>` : ""}

        <hr>
        <div class="d-flex justify-content-between align-items-center">
          <div>
            <div class="fw-semibold">${job.employerName || "Employer"}</div>
            <div class="text-muted small">⭐ ${job.employerRating != null ? job.employerRating.toFixed(1) : "New"}</div>
          </div>
          <div id="applyArea">${actionHtml}</div>
        </div>
      </div>`;

    const applyBtn = document.getElementById("applyBtn");
    if (applyBtn) {
      applyBtn.addEventListener("click", () => openApplyModal(job.id));
    }
  }

  async function openApplyModal(jobId) {
    const message = prompt("Add an optional message to the employer (or leave blank):", "");
    if (message === null) return;
    try {
      await WS.post("/applications", { jobId: Number(jobId), coverMessage: message });
      WS.showAlert("jdAlert", "Application submitted successfully!", "success");
      loadJobDetail();
    } catch (err) {
      WS.showAlert("jdAlert", "Could not apply: " + err.message);
    }
  }

  loadJobDetail();
</script>
</body>
</html>
