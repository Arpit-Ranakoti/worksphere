<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — WorkSphere</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<div id="navbar"></div>

<div class="container min-vh-80 d-flex align-items-center justify-content-center py-5">
  <div class="card-ws p-4" style="max-width:420px;width:100%;">
    <h3 class="text-navy fw-bold mb-1">Welcome back</h3>
    <p class="text-muted mb-4">Login to continue to WorkSphere</p>

    <div id="loginAlert"></div>

    <form id="loginForm">
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" id="loginEmail" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" class="form-control" id="loginPassword" required>
      </div>
      <button type="submit" class="btn btn-accent w-100">Login</button>
    </form>

    <div class="text-center mt-3">
      <small class="text-muted">Don't have an account? <a href="register.html">Sign up</a></small>
    </div>

    <hr>
    <div class="small text-muted">
      <strong>Demo accounts:</strong><br>
      Admin: admin@worksphere.com / Admin@123<br>
      Worker: worker1@worksphere.com / Worker@123<br>
      Employer: employer1@worksphere.com / Employer@123
    </div>
  </div>
</div>

<div id="footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script src="js/auth.js"></script>
<script>
  WS.renderNavbar("navbar");
  WS.renderFooter("footer");
</script>
</body>
</html>
