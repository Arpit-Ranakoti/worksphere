<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>My Profile — WorkSphere</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><link href="css/style.css" rel="stylesheet"></head>
<body><div id="navbar"></div><main class="container py-4 py-lg-5" style="max-width:980px">
<div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4"><div><div class="text-muted small text-uppercase fw-semibold">Account</div><h2 class="section-title mb-1">My Profile</h2><p class="text-muted mb-0">Manage your personal details and worker profile.</p></div><button id="editToggle" class="btn btn-accent"><i class="bi bi-pencil me-1"></i> Edit profile</button></div>
<div id="profileAlert"></div><section class="card-ws p-4 mb-4"><div class="d-flex align-items-center gap-3 mb-4"><div class="rounded-circle d-flex align-items-center justify-content-center bg-light text-navy" style="width:64px;height:64px;font-size:1.6rem"><i class="bi bi-person"></i></div><div><h4 id="displayName" class="mb-1">Your profile</h4><div class="text-muted" id="displayEmail"></div><span class="badge text-bg-light mt-1">Worker account</span></div></div>
<form id="profileForm"><div class="row g-3"><div class="col-md-6"><label class="form-label">Full name</label><input class="form-control profile-field" id="fullName" required></div><div class="col-md-6"><label class="form-label">Email address</label><input class="form-control profile-field" id="email" type="email" readonly aria-describedby="emailHelp"></div><div class="col-md-6"><label class="form-label">Phone number</label><input class="form-control profile-field" id="phone" type="tel"></div><div class="col-md-6"><label class="form-label">Current location</label><input class="form-control profile-field" id="location" placeholder="City or area"></div><div class="col-12"><label class="form-label">About me</label><textarea class="form-control profile-field" id="bio" rows="3" placeholder="Tell employers about your experience and strengths"></textarea></div><div class="col-md-6"><label class="form-label">Availability</label><input class="form-control profile-field" id="availability" placeholder="e.g. Weekends, evenings"></div><div class="col-12"><label class="form-label">Skills</label><div id="skills" class="d-flex flex-wrap gap-2"></div></div></div><div id="formActions" class="d-none mt-4"><button class="btn btn-accent" type="submit">Save changes</button><button class="btn btn-outline-secondary ms-2" type="button" id="cancelEdit">Cancel</button></div></form></section>
<div class="row g-3"><div class="col-md-4"><div class="stat-card"><div class="stat-value" id="profRating">New</div><div class="stat-label">Rating</div></div></div><div class="col-md-4"><div class="stat-card"><div class="stat-value" id="profStrikes">0</div><div class="stat-label">Strikes</div></div></div><div class="col-md-4"><div class="stat-card"><div class="stat-value" id="skillCount">0</div><div class="stat-label">Skills listed</div></div></div></div>
</main><div id="footer"></div><script src="js/config.js"></script><script src="js/app.js"></script><script>
const user=WS.requireAuth(["JOB_SEEKER"]); if(user){WS.renderNavbar("navbar","profile");WS.renderFooter("footer");}
const skillOptions=["Event Management","Cooking","Cleaning","Delivery","Driving","Customer Service","Cash Handling","Data Entry","Computer Skills","Sales","Warehouse","Security","Photography","Waiter","Packing","Marketing","Construction","Communication"];
let saved={}; let selectedSkills=[];
function setEditing(on){document.querySelectorAll(".profile-field").forEach(x=>x.disabled=!on);document.querySelectorAll("#skills input").forEach(x=>x.disabled=!on);document.getElementById("formActions").classList.toggle("d-none",!on);document.getElementById("editToggle").classList.toggle("d-none",on);}
function renderSkills(){document.getElementById("skills").innerHTML=skillOptions.map(s=>`<label class="border rounded-pill px-3 py-2 small"><input class="form-check-input me-1" type="checkbox" value="${s}" ${selectedSkills.includes(s)?"checked":""} disabled> ${s}</label>`).join("");}
async function load(){try{const [me,p]=await Promise.all([WS.get("/users/me"),WS.get("/users/me/worker-profile")]);saved={me,p};fullName.value=me.fullName||"";email.value=me.email||"";phone.value=me.phone||"";location.value=p.location||"";bio.value=p.bio||"";availability.value=p.availability||"";selectedSkills=p.skills||[];renderSkills();displayName.textContent=me.fullName||"Your profile";displayEmail.textContent=me.email||"";profRating.textContent=p.rating!=null?"★ "+p.rating.toFixed(1):"New";profStrikes.textContent=p.strikeCount??0;skillCount.textContent=selectedSkills.length;setEditing(false);}catch(e){WS.showAlert("profileAlert","Could not load profile: "+e.message);}}
editToggle.onclick=()=>setEditing(true);cancelEdit.onclick=()=>{load();};
profileForm.onsubmit=async e=>{e.preventDefault();try{const skills=[...document.querySelectorAll("#skills input:checked")].map(x=>x.value);const updatedUser=await WS.put("/users/me",{fullName:fullName.value,phone:phone.value});WS.setSession(WS.getToken(),updatedUser);await WS.put("/users/me/worker-profile",{location:location.value,bio:bio.value,availability:availability.value,skills});WS.showAlert("profileAlert","Profile updated successfully.","success");await load();}catch(err){WS.showAlert("profileAlert","Could not save profile: "+err.message);}};load();
</script></body></html>
