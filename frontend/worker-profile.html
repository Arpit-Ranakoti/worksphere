<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile — WorkSphere</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<div id="navbar"></div>

<div class="container py-4">
  <h2 class="section-title">My Profile</h2>
  <div id="profileAlert"></div>

  <div class="card-ws p-4">
    <form id="profileForm">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Bio</label>
          <textarea class="form-control" id="bio" rows="3" placeholder="Tell employers about yourself..."></textarea>
        </div>
        <div class="col-md-6">
          <label class="form-label">Current Location</label>
          <input type="text" class="form-control" id="currentLocation" placeholder="e.g. Rishikesh">

          <label class="form-label mt-3">Preferred Locations (comma separated)</label>
          <input type="text" class="form-control" id="preferredLocations" placeholder="Rishikesh, Haridwar, Dehradun">
        </div>
        <div class="col-12">
          <label class="form-label">Skills</label>
          <div id="skillsCheckboxes" class="d-flex flex-wrap gap-2"></div>
        </div>
      </div>
      <button type="submit" class="btn btn-accent mt-4">Save Profile</button>
    </form>
  </div>

  <div class="row g-3 mt-4">
    <div class="col-md-4"><div class="stat-card"><div class="stat-value" id="profRating">-</div><div class="stat-label">Rating</div></div></div>
    <div class="col-md-4"><div class="stat-card"><div class="stat-value" id="profCompleted">-</div><div class="stat-label">Completed Jobs</div></div></div>
    <div class="col-md-4"><div class="stat-card"><div class="stat-value" id="profStrikes">-</div><div class="stat-label">Strikes</div></div></div>
  </div>
</div>

<div id="footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script>
  const user = WS.requireAuth(["JOB_SEEKER"]);
  WS.renderNavbar("navbar", "profile");
  WS.renderFooter("footer");

  const ALL_SKILLS = ["Event Management","Cooking","Cleaning","Delivery","Driving","Customer Service",
    "Cash Handling","Data Entry","Computer Skills","Sales","Warehouse","Security","Photography",
    "Waiter","Packing","Marketing","Construction","Communication"];

  let mySkillIds = [];

  function renderSkillCheckboxes(selected) {
    document.getElementById("skillsCheckboxes").innerHTML = ALL_SKILLS.map(skill => `
      <div class="form-check form-check-inline border rounded-pill px-3 py-1">
        <input class="form-check-input" type="checkbox" value="${skill}" id="skill-${skill.replace(/\s/g,'')}"
          ${selected.includes(skill) ? "checked" : ""}>
        <label class="form-check-label" for="skill-${skill.replace(/\s/g,'')}">${skill}</label>
      </div>`).join("");
  }

  async function loadProfile() {
    try {
      const profile = await WS.get("/users/me/worker-profile");
      document.getElementById("bio").value = profile.bio || "";
      document.getElementById("currentLocation").value = profile.currentLocation || "";
      document.getElementById("preferredLocations").value = (profile.preferredLocations || []).join(", ");
      document.getElementById("profRating").innerText = profile.rating != null ? "⭐ " + profile.rating.toFixed(1) : "New";
      document.getElementById("profCompleted").innerText = profile.completedJobs ?? 0;
      document.getElementById("profStrikes").innerText = profile.strikeCount ?? 0;
      renderSkillCheckboxes(profile.skills || []);
    } catch (e) {
      renderSkillCheckboxes([]);
    }
  }

  document.getElementById("profileForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const skills = Array.from(document.querySelectorAll("#skillsCheckboxes input:checked")).map(i => i.value);
    const preferredLocations = document.getElementById("preferredLocations").value
      .split(",").map(s => s.trim()).filter(Boolean);

    try {
      await WS.put("/users/me/worker-profile", {
        bio: document.getElementById("bio").value,
        currentLocation: document.getElementById("currentLocation").value,
        preferredLocations,
        skills
      });
      WS.showAlert("profileAlert", "Profile saved successfully!", "success");
    } catch (err) {
      WS.showAlert("profileAlert", "Could not save profile: " + err.message);
    }
  });

  loadProfile();
</script>
</body>
</html>
