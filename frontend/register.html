<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — WorkSphere</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<div id="navbar"></div>

<div class="container min-vh-80 d-flex align-items-center justify-content-center py-5">
  <div class="card-ws p-4" style="max-width:460px;width:100%;">
    <h3 class="text-navy fw-bold mb-1">Create your account</h3>
    <p class="text-muted mb-4">Join WorkSphere as a worker or employer</p>

    <div id="registerAlert"></div>

    <form id="registerForm">
      <div class="mb-3">
        <label class="form-label">Full Name</label>
        <input type="text" class="form-control" id="regName" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" id="regEmail" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Phone</label>
        <input type="tel" class="form-control" id="regPhone" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" class="form-control" id="regPassword" minlength="6" required>
        <div class="form-text">Minimum 6 characters.</div>
      </div>
      <div class="mb-3">
        <label class="form-label">I am a...</label>
        <select class="form-select" id="regRole" required>
          <option value="JOB_SEEKER">Job Seeker (looking for work)</option>
          <option value="EMPLOYER">Employer (posting jobs)</option>
        </select>
      </div>
      <button type="submit" class="btn btn-accent w-100">Create Account</button>
    </form>

    <div class="text-center mt-3">
      <small class="text-muted">Already have an account? <a href="login.html">Login</a></small>
    </div>
  </div>
</div>

<div id="footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script src="js/auth.js"></script>
<script>
  WS.renderNavbar("navbar");
  WS.renderFooter("footer");
</script>
</body>
</html>
