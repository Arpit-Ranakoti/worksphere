<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Worker Dashboard — WorkSphere</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<div id="navbar"></div>

<div class="container py-4">
  <h2 class="text-navy fw-bold" id="welcomeMsg">Welcome!</h2>

  <div class="row g-3 my-2">
    <div class="col-md-3 col-6"><div class="stat-card"><div class="stat-value" id="statPending">-</div><div class="stat-label">Pending Applications</div></div></div>
    <div class="col-md-3 col-6"><div class="stat-card"><div class="stat-value" id="statSelected">-</div><div class="stat-label">Selected</div></div></div>
    <div class="col-md-3 col-6"><div class="stat-card"><div class="stat-value" id="statRating">-</div><div class="stat-label">Rating</div></div></div>
    <div class="col-md-3 col-6"><div class="stat-card"><div class="stat-value" id="statStrikes">-</div><div class="stat-label">Strikes</div></div></div>
  </div>

  <h4 class="section-title mt-4">Recommended Jobs</h4>
  <div id="recommendedJobs" class="row g-3">
    <div class="col-12 text-muted">Loading...</div>
  </div>

  <h4 class="section-title mt-4">Upcoming Commitments</h4>
  <div id="upcomingCommitments" class="list-group">
    <div class="text-muted">Loading...</div>
  </div>
</div>

<div id="footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script src="js/worker.js"></script>
</body>
</html>
