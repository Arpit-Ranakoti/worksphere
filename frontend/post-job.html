<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Post a Job — WorkSphere</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<div id="navbar"></div>

<div class="container py-4">
  <h2 class="section-title">Post a New Job</h2>
  <div id="postJobAlert"></div>

  <div class="card-ws p-4">
    <form id="postJobForm">
      <div class="row g-3">
        <div class="col-md-8">
          <label class="form-label">Job Title</label>
          <input type="text" class="form-control" id="title" required>
        </div>
        <div class="col-md-4">
          <label class="form-label">Category</label>
          <select class="form-select" id="category" required>
            <option>Events</option><option>Restaurants</option><option>Delivery</option>
            <option>Retail</option><option>Warehouse</option><option>Construction</option>
            <option>Hospitality</option><option>Cleaning</option><option>Data Entry</option>
            <option>Marketing</option><option>Photography</option><option>Customer Service</option>
            <option>Other</option>
          </select>
        </div>

        <div class="col-12">
          <label class="form-label">Description</label>
          <textarea class="form-control" id="description" rows="3" required></textarea>
        </div>

        <div class="col-12">
          <label class="form-label">Required Skills (optional — leave blank if none)</label>
          <div id="skillsCheckboxes" class="d-flex flex-wrap gap-2"></div>
        </div>

        <div class="col-md-6">
          <label class="form-label">Location</label>
          <input type="text" class="form-control" id="location" placeholder="e.g. Rishikesh" required>
        </div>
        <div class="col-md-3">
          <label class="form-label">Date</label>
          <input type="date" class="form-control" id="jobDate" required>
        </div>
        <div class="col-md-3">
          <label class="form-label">Workers Required</label>
          <input type="number" min="1" class="form-control" id="workersRequired" required>
        </div>

        <div class="col-md-3">
          <label class="form-label">Start Time</label>
          <input type="time" class="form-control" id="startTime" required>
        </div>
        <div class="col-md-3">
          <label class="form-label">End Time</label>
          <input type="time" class="form-control" id="endTime" required>
        </div>
        <div class="col-md-3">
          <label class="form-label">Pay (₹)</label>
          <input type="number" min="1" class="form-control" id="pay" required>
        </div>
        <div class="col-md-3">
          <label class="form-label">Deposit (₹, optional)</label>
          <input type="number" min="0" class="form-control" id="depositAmount" placeholder="0">
        </div>
      </div>

      <button type="submit" class="btn btn-accent mt-4">Post Job</button>
    </form>
  </div>
</div>

<div id="footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script>
  const user = WS.requireAuth(["EMPLOYER"]);
  WS.renderNavbar("navbar", "postjob");
  WS.renderFooter("footer");

  const ALL_SKILLS = ["Event Management","Cooking","Cleaning","Delivery","Driving","Customer Service",
    "Cash Handling","Data Entry","Computer Skills","Sales","Warehouse","Security","Photography",
    "Waiter","Packing","Marketing","Construction","Communication"];

  document.getElementById("skillsCheckboxes").innerHTML = ALL_SKILLS.map(skill => `
    <div class="form-check form-check-inline border rounded-pill px-3 py-1">
      <input class="form-check-input" type="checkbox" value="${skill}" id="skill-${skill.replace(/\s/g,'')}">
      <label class="form-check-label" for="skill-${skill.replace(/\s/g,'')}">${skill}</label>
    </div>`).join("");

  document.getElementById("postJobForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const requiredSkills = Array.from(document.querySelectorAll("#skillsCheckboxes input:checked")).map(i => i.value);
    const depositAmount = Number(document.getElementById("depositAmount").value) || 0;

    const payload = {
      title: document.getElementById("title").value,
      category: document.getElementById("category").value,
      description: document.getElementById("description").value,
      requiredSkills,
      location: document.getElementById("location").value,
      jobDate: document.getElementById("jobDate").value,
      startTime: document.getElementById("startTime").value,
      endTime: document.getElementById("endTime").value,
      pay: Number(document.getElementById("pay").value),
      workersRequired: Number(document.getElementById("workersRequired").value),
      depositRequired: depositAmount > 0,
      depositAmount
    };

    try {
      const job = await WS.post("/jobs", payload);
      window.location.href = `job-details.html?id=${job.id}`;
    } catch (err) {
      WS.showAlert("postJobAlert", "Could not post job: " + err.message);
    }
  });
</script>
</body>
</html>
