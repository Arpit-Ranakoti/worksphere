spring.application.name=worksphere-backend
server.port=8080
spring.datasource.url=jdbc:h2:mem:worksphere;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.sql.init.mode=never
spring.h2.console.enabled=true
worksphere.jwt.secret=WorkSphereDemoSecretKeyForJwtSigningChangeMe1234567890
worksphere.jwt.expiration-ms=86400000
server.error.include-message=always
